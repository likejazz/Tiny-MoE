[project]
name = "tiny-moe"
version = "0.1.0"
description = "A lightweight Mixture-of-Experts language model implemented from scratch in native PyTorch."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "torch==2.14.0",
    "accelerate==1.15.0",
    "deepspeed==0.19.7",
    "transformers==5.17.0",
    "datasets==5.0.1",
    "bitsandbytes==0.50.2",
    "safetensors==0.8.0",
    "tqdm==4.70.1",
    "wandb==0.30.0",
    "huggingface_hub==1.33.0",
]

[dependency-groups]
dev = [
    "ruff==0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "SIM", # simplify
]
