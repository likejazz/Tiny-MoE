[project]
name = "tiny-moe"
version = "0.1.0"
description = "A lightweight Mixture-of-Experts language model implemented from scratch in native PyTorch."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "accelerate",
    "deepspeed",
    "transformers",
    "datasets",
    "bitsandbytes",
    "safetensors",
    "tqdm",
    "wandb",
    "huggingface_hub",
]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "SIM", # simplify
]
